  <g id="text_14">
   <text style="font-weight: 500; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start" x="36.288" y="28.08" transform="rotate(-0 36.288 28.08)">Refinement versus matched-capacity controls</text>
  </g>
  <g id="text_15">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(36.288 53.202406)">300 response-changing worlds; 16 fixed held-out environments; horizon 10.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(36.288 65.52)">Ten shared seed clusters, not individual worlds or predictions, determine uncertainty.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="36.288" y="418.86" transform="rotate(-0 36.288 418.86)">Gray dots: seed-level effects. Black diamond: paired mean. Lines: seed-cluster bootstrap intervals (5,000 replications).</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="36.288" y="442.26" transform="rotate(-0 36.288 442.26)">Primary compares RBF/targeted with random-search/random-capacity strategies and can differ in capacity. The four lower rows isolate refinement.</text>
  </g>
