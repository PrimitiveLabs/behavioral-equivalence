  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6065" x="31.752" y="41.58" transform="rotate(-0 31.752 41.58)">Trust-family world, 128 states, seed 20000; 10,000 sampled transitions per row; concrete origin 0.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6065" x="31.752" y="374.22" transform="rotate(-0 31.752 374.22)">Intervals include hidden-state and transition uncertainty. No additional nominal abstraction allowance is added.</text>
  </g>
