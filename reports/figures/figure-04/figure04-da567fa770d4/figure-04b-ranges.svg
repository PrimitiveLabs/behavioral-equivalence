   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6065" x="31.752" y="386.1" transform="rotate(-0 31.752 386.1)">Known-model marker uses integer-enclosure midpoints. Clopper-Pearson quantiles remain floating. No human prediction claim.</text>
